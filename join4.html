<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>مجتمع إتقان</title>
<meta property="og:title" content="مجتمع إتقان على واتساب">
<meta property="og:image" content="https://essamgm.github.io/Essam/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root { --navy:#14365C; --gold:#B8860B; --red:#E0263C; --line:#E6E7EC; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body { font-family:'Cairo', sans-serif; color:var(--navy); background:#fff; overflow:hidden; }

  /* arrow to the real ⋯ at the top-right of TikTok's bar */
  .top { position:fixed; top:8px; right:10px; display:flex; flex-direction:column; align-items:flex-start; color:var(--red); }
  .top svg { width:64px; height:86px; animation:nudge 1.1s ease-in-out infinite; }
  .glyph { width:54px; height:54px; border-radius:50%; border:4px solid var(--red); display:flex; align-items:center; justify-content:center; background:#fff; margin-top:2px; }
  .glyph i { display:block; width:8px; height:8px; border-radius:50%; background:#111; margin:0 2.5px; }
  .top .t { font-weight:900; font-size:21px; line-height:1.2; margin-top:2px; text-align:right; }
  @keyframes nudge { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }

  /* arrow to a possible ⋯ at the bottom-right */
  .bot { position:fixed; bottom:8px; right:10px; display:flex; flex-direction:column; align-items:flex-start; color:var(--red); }
  .bot .t { font-weight:900; font-size:18px; line-height:1.2; margin-bottom:2px; }
  .bot svg { width:54px; height:74px; animation:nudge2 1.1s ease-in-out infinite; }
  @keyframes nudge2 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(9px)} }

  /* centre: photo + the button to press */
  .mid { position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:70px 22px 0; }
  .photo { width:172px; height:172px; border-radius:50%; object-fit:cover; object-position:50% 30%; border:3px solid #fff; box-shadow:0 0 0 2px var(--gold), 0 8px 22px rgba(20,54,92,.15); }
  .me { position:fixed; top:14px; left:16px; width:180px; display:flex; flex-direction:column; align-items:center; z-index:2; }
  .name { font-weight:900; font-size:22px; margin-top:8px; text-align:center; white-space:nowrap; }
  .then { align-self:stretch; max-width:340px; margin:0 auto; width:100%; text-align:right; padding-right:6px; }
  .then { font-weight:900; font-size:22px; }
  .menu { width:100%; max-width:340px; background:#fff; border:1px solid var(--line); border-radius:16px; padding:8px; box-shadow:0 10px 30px rgba(0,0,0,.08); font-family:-apple-system,'Segoe UI',Roboto,sans-serif; color:#333; }
  .row { padding:12px 14px; font-size:16px; border-radius:10px; display:flex; align-items:center; gap:12px; }
  .row + .row { margin-top:4px; }
  .row.hi { border:4px solid var(--red); font-weight:700; color:#111; font-size:18px; animation:glow 1.1s ease-in-out infinite; }
  @keyframes glow { 0%,100%{box-shadow:0 0 0 0 rgba(224,38,60,.45)} 50%{box-shadow:0 0 0 8px rgba(224,38,60,0)} }
  .ic { width:22px; text-align:center; color:#666; }
</style>
</head>
<body>

<div class="top">
  <svg viewBox="0 0 64 86" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 80 C 22 50, 36 30, 54 10"/>
    <path d="M30 12 L54 10 L52 34"/>
  </svg>
  <div class="glyph"><i></i><i></i><i></i></div>
</div>

<div class="me"><img class="photo" src="profile.jpg" alt=""><div class="name">عصام الغامدي</div></div>

<div class="mid">
    <div class="then">ثم اضغط</div>
  <div class="menu">
    <div class="row"><span class="ic">⧉</span>نسخ الرابط</div>
    <div class="row hi"><span class="ic">🌐</span>فتح في المتصفح</div>
    <div class="row"><span class="ic">↻</span>تحديث</div>
  </div>
</div>

<div class="bot">
  <div class="glyph"><i></i><i></i><i></i></div>
  <svg viewBox="0 0 54 74" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 6 C 20 30, 32 48, 46 68"/>
    <path d="M24 64 L46 68 L46 44"/>
  </svg>
</div>

<script>
(function(){
  // Inside TikTok's in-app browser nothing can open WhatsApp, so only the instructions are shown.
  // In a real browser, go straight to the invite.
  var ua = navigator.userAgent || "";
  var inTikTok = /musical_ly|trill|Bytedance|BytedanceWebview|TikTok|aweme/i.test(ua);
  if (!inTikTok) {
    setTimeout(function(){ window.location.href = "https://chat.whatsapp.com/CMoWao3vis84zenCKDE6Ap"; }, 100);
  }
})();
</script>
</body>
</html>
