<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>مجتمع إتقان</title>
<meta property="og:title" content="مجتمع إتقان على واتساب">
<meta property="og:image" content="https://essamgm.github.io/Essam/og-image.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Cairo:wght@700;900&display=swap" rel="stylesheet">

<style>
  :root { --navy:#14365C; --gold:#B8860B; --ink:#1A1A2E; --gray:#5A5A6E; --line:#E6E7EC; --bg-soft:#F6F7F9; --red:#E0263C; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'IBM Plex Sans Arabic', sans-serif; color:var(--ink); background:#fff; line-height:1.6; }
  .wrap { max-width:430px; margin:0 auto; padding:18px 18px 24px; }

  /* photo + order */
  .me { display:flex; align-items:center; gap:14px; }
  .photo { flex:none; width:92px; height:92px; border-radius:50%; object-fit:cover; object-position:50% 30%; border:3px solid #fff; box-shadow:0 0 0 2px var(--gold), 0 8px 22px rgba(20,54,92,.15); }
  .bubble { position:relative; background:var(--navy); color:#fff; border-radius:16px; padding:12px 16px; font-family:'Cairo', sans-serif; font-weight:700; font-size:19px; line-height:1.45; }
  .bubble::before { content:""; position:absolute; right:-9px; top:50%; margin-top:-9px; border:9px solid transparent; border-left-color:var(--navy); border-right:0; }
  .name { font-size:13px; color:var(--gray); margin-top:6px; text-align:center; width:92px; }
  .me-col { display:flex; flex-direction:column; align-items:center; flex:none; }

  .steps { margin-top:16px; }
  .step { background:var(--bg-soft); border-radius:16px; padding:14px 14px 12px; margin-bottom:12px; }
  .step-title { display:flex; align-items:center; gap:10px; font-family:'Cairo', sans-serif; font-weight:700; font-size:18px; color:var(--navy); margin-bottom:10px; }
  .num { flex:none; width:30px; height:30px; border-radius:50%; background:var(--navy); color:#fff; display:flex; align-items:center; justify-content:center; font-size:16px; }
  .dots-inline { font-family:sans-serif; font-weight:900; letter-spacing:1px; }

  /* mock screen with two possible dot positions */
  .screen { position:relative; height:150px; background:#fff; border:1px solid var(--line); border-radius:14px; overflow:hidden; }
  .screen .top, .screen .bot { position:absolute; left:0; right:0; height:40px; background:#fafafa; }
  .screen .top { top:0; border-bottom:1px solid var(--line); }
  .screen .bot { bottom:0; border-top:1px solid var(--line); }
  .d { position:absolute; right:10px; width:38px; height:38px; border-radius:50%; border:3px solid var(--red); display:flex; align-items:center; justify-content:center; font-family:sans-serif; font-weight:900; font-size:20px; letter-spacing:1px; color:#111; background:#fff; animation:pulse 1.4s ease-in-out infinite; }
  .d.t { top:1px; } .d.b { bottom:1px; }
  @keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.1)} }
  .arrow { position:absolute; right:58px; display:flex; align-items:center; gap:6px; color:var(--red); font-family:'Cairo', sans-serif; font-weight:700; font-size:15px; direction:rtl; }
  .arrow.t { top:7px; } .arrow.b { bottom:7px; }
  .arrow svg { width:34px; height:18px; }
  .mid { position:absolute; top:50%; left:0; right:0; transform:translateY(-50%); text-align:center; color:var(--gray); font-size:13px; }

  .sheet { background:#fff; border:1px solid var(--line); border-radius:14px; padding:10px; }
  .sheet .row { border-radius:10px; padding:10px 14px; font-size:15px; color:#444; display:flex; align-items:center; gap:10px; }
  .sheet .row + .row { margin-top:6px; }
  .sheet .row.hi { border:3px solid var(--red); font-weight:700; color:#111; background:#fff; }
  .sheet .ic { width:20px; text-align:center; color:#777; }
</style>
</head>
<body>
<div class="wrap">
  <div class="me">
    <div class="me-col">
      <img class="photo" src="profile.jpg" alt="عصام الغامدي">
      <div class="name">عصام الغامدي</div>
    </div>
    <div class="bubble">افتح هذه الصفحة في المتصفح، وبيفتح لك مجتمع إتقان في واتساب</div>
  </div>

  <div class="steps">
    <div class="step">
      <div class="step-title"><span class="num">١</span>اضغط النقاط الثلاث <span class="dots-inline">···</span></div>
      <div class="screen">
        <div class="top"></div>
        <div class="d t">···</div>
        <div class="arrow t"><svg viewBox="0 0 34 18"><path d="M1 9h27" stroke="currentColor" stroke-width="3" fill="none"/><path d="M22 2l8 7-8 7" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>هنا فوق</div>
        <div class="mid">أو</div>
        <div class="bot"></div>
        <div class="d b">···</div>
        <div class="arrow b"><svg viewBox="0 0 34 18"><path d="M1 9h27" stroke="currentColor" stroke-width="3" fill="none"/><path d="M22 2l8 7-8 7" stroke="currentColor" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>هنا تحت</div>
      </div>
    </div>

    <div class="step">
      <div class="step-title"><span class="num">٢</span>اضغط «فتح في المتصفح»</div>
      <div class="sheet">
        <div class="row"><span class="ic">⧉</span>نسخ الرابط</div>
        <div class="row hi"><span class="ic">🌐</span>فتح في المتصفح</div>
        <div class="row"><span class="ic">↻</span>تحديث</div>
      </div>
    </div>
  </div>
</div>

<script>
(function(){
  // Inside TikTok's in-app browser nothing can open WhatsApp, so only the steps are shown.
  // In a real browser, go straight to the invite.
  var ua = navigator.userAgent || "";
  var inTikTok = /musical_ly|trill|Bytedance|BytedanceWebview|TikTok|aweme/i.test(ua);
  if (!inTikTok) {
    setTimeout(function(){ window.location.href = "https://chat.whatsapp.com/CMoWao3vis84zenCKDE6Ap"; }, 100);
  }
})();
</script>
</body>
</html>
