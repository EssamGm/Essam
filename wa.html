<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>إتقان — مجتمع واتساب</title>
<meta property="og:title" content="مجتمع إتقان على واتساب">
<meta property="og:image" content="https://essamgm.github.io/Essam/og-image.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Cairo:wght@700;900&display=swap" rel="stylesheet">

<style>
  :root { --navy:#14365C; --gold:#B8860B; --ink:#1A1A2E; --gray:#5A5A6E; --line:#E6E7EC; --wa-green:#128c7e; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:'IBM Plex Sans Arabic', sans-serif; color:var(--ink); background:#fff; line-height:1.85; }
  main { min-height:calc(100svh - 64px); display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:40px 24px; }
  .logo { font-family:'Cairo', sans-serif; font-weight:900; font-size:40px; color:var(--navy); letter-spacing:-1px; display:inline-flex; align-items:baseline; gap:2px; }
  .logo .dot { display:inline-block; width:9px; height:9px; background:var(--gold); margin-right:2px; transform:translateY(-3px); }
  h1 { font-family:'Cairo', sans-serif; font-weight:700; font-size:22px; color:var(--navy); margin:28px 0 24px; }
  .btn { background:var(--wa-green); color:#fff; font-family:'Cairo', sans-serif; font-weight:700; font-size:18px; padding:14px 32px; border-radius:100px; text-decoration:none; display:inline-flex; align-items:center; gap:9px; }
  .btn svg { width:20px; height:20px; fill:currentColor; }
  .hint { display:none; margin-top:28px; padding-top:20px; border-top:1px solid var(--line); max-width:360px; font-size:14px; color:var(--gray); }
  .hint.show { display:block; }
  .hint b { color:var(--ink); font-weight:600; }
  footer { padding:0 0 28px; text-align:center; color:var(--gray); font-size:13px; }
</style>
</head>
<body>
<main>
  <div class="logo">إتقان<span class="dot"></span></div>
  <h1 id="h">جاري فتح واتساب…</h1>
  <a class="btn" id="go" href="https://chat.whatsapp.com/CMoWao3vis84zenCKDE6Ap">
    <svg viewBox="0 0 24 24"><path d="M19.05 4.91A9.816 9.816 0 0 0 12.04 2c-5.46 0-9.91 4.45-9.91 9.91 0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21 5.46 0 9.91-4.45 9.91-9.91 0-2.65-1.03-5.14-2.9-7.01zm-7.01 15.24c-1.48 0-2.93-.4-4.2-1.15l-.3-.18-3.12.82.83-3.04-.2-.31a8.264 8.264 0 0 1-1.26-4.38c0-4.54 3.7-8.24 8.24-8.24 2.2 0 4.27.86 5.82 2.42a8.183 8.183 0 0 1 2.41 5.83c.01 4.55-3.69 8.23-8.22 8.23zm4.52-6.16c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.12-.17.25-.64.81-.78.97-.15.17-.29.19-.54.06-1.45-.72-2.4-1.29-3.36-2.92-.25-.44.25-.41.72-1.36.08-.17.04-.31-.04-.43-.08-.12-.7-1.68-.96-2.3-.25-.62-.51-.53-.7-.54-.18-.01-.39-.01-.6-.01-.21 0-.55.08-.84.39-.29.31-1.11 1.08-1.11 2.64s1.14 3.06 1.3 3.27c.16.21 2.21 3.39 5.45 4.62 2.71 1.03 2.71.69 3.7.58.99-.11 3.2-1.31 3.65-2.58.45-1.27.45-2.36.31-2.58-.13-.21-.32-.32-.57-.44z"/></svg>
    انضم لمجتمع إتقان
  </a>
  <div class="hint" id="hint">إذا ما فتح واتساب: اضغط <b>⋯</b> فوق، ثم <b>فتح في المتصفح</b>، وبعدها اضغط الزر.</div>
</main>
<footer>م. عصام الغامدي · مدرب تعلّم لغات</footer>
<script>
(function(){
  var CODE = "CMoWao3vis84zenCKDE6Ap";
  var https = "https://chat.whatsapp.com/" + CODE;
  var ua = navigator.userAgent || "";
  var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/i.test(ua);
  var iosJump = "x-safari-https://chat.whatsapp.com/" + CODE;
  var androidIntent = "intent://chat.whatsapp.com/" + CODE + "#Intent;scheme=https;package=com.whatsapp;S.browser_fallback_url=" + encodeURIComponent(https) + ";end";
  var target = isIOS ? iosJump : (isAndroid ? androidIntent : https);
  document.getElementById("go").setAttribute("href", target);
  var left = false;
  document.addEventListener("visibilitychange", function(){ if (document.hidden) left = true; });
  window.addEventListener("pagehide", function(){ left = true; });
  setTimeout(function(){ try { window.location.href = target; } catch(e){} }, 150);
  setTimeout(function(){
    if (!left) { document.getElementById("h").textContent = "اضغط الزر لفتح واتساب"; document.getElementById("hint").classList.add("show"); }
  }, 2200);
})();
</script>
</body>
</html>
