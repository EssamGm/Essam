<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>مجتمع إتقان</title>
<meta property="og:title" content="مجتمع إتقان على واتساب">
<meta property="og:image" content="https://essamgm.github.io/Essam/og-image.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;900&display=swap" rel="stylesheet">
<style>
  :root { --navy:#14365C; --gold:#B8860B; --red:#E0263C; --line:#E6E7EC; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body { font-family:'Cairo', sans-serif; color:var(--navy); background:#fff; overflow:hidden; }

  /* corner pointers: arrow + the ⋯ glyph, identical top and bottom */
  .corner { position:fixed; right:8px; display:flex; flex-direction:column; align-items:center; color:var(--red); width:96px; }
  .corner.top { top:6px; }
  .corner.bot { bottom:6px; flex-direction:column-reverse; }
  .corner svg { width:70px; height:78px; }
  .corner.top svg { animation:up 1.1s ease-in-out infinite; }
  .corner.bot svg { animation:down 1.1s ease-in-out infinite; }
  @keyframes up { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }
  @keyframes down { 0%,100%{transform:translateY(0)} 50%{transform:translateY(10px)} }
  .glyph { width:64px; height:64px; border-radius:50%; border:4px solid var(--red); display:flex; align-items:center; justify-content:center; background:#fff; }
  .glyph i { display:block; width:10px; height:10px; border-radius:50%; background:#111; margin:0 3px; }

  /* photo + name, left half */
  .me { position:fixed; top:34px; left:22px; width:170px; display:flex; flex-direction:column; align-items:center; }
  .photo { width:150px; height:150px; border-radius:50%; object-fit:cover; object-position:50% 30%; border:4px solid #fff; box-shadow:0 0 0 2px var(--gold), 0 10px 26px rgba(20,54,92,.18); }
  .name { font-weight:900; font-size:21px; margin-top:8px; white-space:nowrap; }

  /* the menu as it appears, with the item to press boxed */
  .sheet { position:fixed; left:14px; right:120px; top:262px; background:#f7f7f9; border:1px solid var(--line); border-radius:18px; padding:16px 10px 14px; font-family:-apple-system,'Segoe UI',Roboto,sans-serif; }
  .items { display:flex; justify-content:space-around; align-items:flex-start; direction:rtl; }
  .it { display:flex; flex-direction:column; align-items:center; gap:8px; width:76px; font-size:12.5px; color:#333; text-align:center; line-height:1.3; }
  .it .ico { width:52px; height:52px; border-radius:50%; background:#fff; border:1px solid var(--line); display:flex; align-items:center; justify-content:center; }
  .it .ico svg { width:24px; height:24px; fill:none; stroke:#222; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
  .it.hi { position:relative; padding:8px 4px; margin:-8px -4px; border:4px solid var(--red); border-radius:14px; font-weight:700; color:#111; animation:glow 1.1s ease-in-out infinite; }
  @keyframes glow { 0%,100%{box-shadow:0 0 0 0 rgba(224,38,60,.5)} 50%{box-shadow:0 0 0 10px rgba(224,38,60,0)} }
  .pt { position:absolute; left:50%; bottom:-58px; transform:translateX(-50%); color:var(--red); width:40px; height:52px; animation:up 1.1s ease-in-out infinite; }
  .handle { width:40px; height:4px; border-radius:2px; background:#d0d0d6; margin:0 auto 14px; }
</style>
</head>
<body>

<div class="corner top">
  <svg viewBox="0 0 70 78" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M35 74 V 12"/><path d="M12 32 L35 8 L58 32"/>
  </svg>
  <div class="glyph"><i></i><i></i><i></i></div>
</div>

<div class="me">
  <img class="photo" src="profile.jpg" alt="">
  <div class="name">عصام الغامدي</div>
</div>

<div class="sheet">
  <div class="handle"></div>
  <div class="items">
    <div class="it"><div class="ico"><svg viewBox="0 0 24 24"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/></svg></div>نسخ الرابط</div>
    <div class="it hi"><div class="ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg></div>فتح في المتصفح
      <svg class="pt" viewBox="0 0 40 52" fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"><path d="M20 48V10"/><path d="M6 22L20 6l14 16"/></svg>
    </div>
    <div class="it"><div class="ico"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7"/><path d="M20 4v5h-5"/></svg></div>تحديث</div>
  </div>
</div>

<div class="corner bot">
  <svg viewBox="0 0 70 78" fill="none" stroke="currentColor" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M35 4 V 66"/><path d="M12 46 L35 70 L58 46"/>
  </svg>
  <div class="glyph"><i></i><i></i><i></i></div>
</div>

<script>
(function(){
  var ua = navigator.userAgent || "";
  var inTikTok = /musical_ly|trill|Bytedance|BytedanceWebview|TikTok|aweme/i.test(ua);
  if (!inTikTok) {
    setTimeout(function(){ window.location.href = "https://chat.whatsapp.com/CMoWao3vis84zenCKDE6Ap"; }, 100);
  }
})();
</script>
</body>
</html>
